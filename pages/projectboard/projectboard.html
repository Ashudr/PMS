<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ONEPWS | Project Board</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- =====================================================
         PROJECT BOARD CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="projectboard.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="logo-area">

        <img src="../../assets/images/onepws-logo.png"
             alt="ONEPWS Logo">

        <div>

            <h2>ONEPWS</h2>

            <p>
                Enterprise Project Management System
            </p>

        </div>

    </div>


    <div class="header-actions">

        <input
            type="text"
            id="searchProject"
            placeholder="Search Project...">

        <button
            id="notificationBtn"
            title="Notifications">

            <i class="fa-solid fa-bell"></i>

        </button>


        <button
            id="profileBtn">

            Ashu
            <i class="fa-solid fa-chevron-down"></i>

        </button>

    </div>

</header>


<!-- =====================================================
     APPLICATION AREA
===================================================== -->

<div class="app-container">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">


        <div class="menu-title">

            MAIN MENU

        </div>


        <a class="menu-item"
           href="../dashboard/dashboard.html">

            <i class="fa-solid fa-table-columns"></i>

            <span>Dashboard</span>

        </a>


        <a class="menu-item active"
           href="../projectboard/projectboard.html">

            <i class="fa-solid fa-diagram-project"></i>

            <span>Project Board</span>

        </a>


        <a class="menu-item"
           href="../progressboard/progressboard.html">

            <i class="fa-solid fa-chart-line"></i>

            <span>Progress Board</span>

        </a>


        <a class="menu-item"
           href="../projectwizard/projectwizard.html">

            <i class="fa-solid fa-wand-magic-sparkles"></i>

            <span>Project Wizard</span>

        </a>


        <a class="menu-item"
           href="../taskboard/taskboard.html">

            <i class="fa-solid fa-list-check"></i>

            <span>Task Board</span>

        </a>


        <a class="menu-item"
           href="../reports/reports.html">

            <i class="fa-solid fa-chart-pie"></i>

            <span>Reports</span>

        </a>


        <a class="menu-item"
           href="../settings/settings.html">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </a>


        <a class="menu-item logout"
           href="#"
           id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </a>


    </aside>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


        <!-- =============================================
             PAGE HEADER
        ============================================== -->

        <section class="page-header">

            <div>

                <h1>Project Board</h1>

            </div>


            <button id="newProject">

                <i class="fa-solid fa-plus"></i>

                New Project

            </button>

        </section>



        <!-- =============================================
             KPI SECTION
        ============================================== -->

        <section class="kpi-container">


            <div class="kpi-box">

                <h3>Active Projects</h3>

                <h2 id="activeProjects">
                    18
                </h2>

            </div>


            <div class="kpi-box">

                <h3>Completed</h3>

                <h2 id="completedProjects">
                    12
                </h2>

            </div>


            <div class="kpi-box">

                <h3>Critical</h3>

                <h2 id="criticalProjects">
                    2
                </h2>

            </div>


            <div class="kpi-box">

                <h3>On Hold</h3>

                <h2 id="holdProjects">
                    3
                </h2>

            </div>


        </section>



        <!-- =============================================
             FILTER SECTION
        ============================================== -->

        <section class="filter-row">


            <select id="financialYearFilter">

                <option value="">
                    Financial Year
                </option>

                <option value="2026-27">
                    2026-27
                </option>

                <option value="2025-26">
                    2025-26
                </option>

            </select>



            <select id="customerFilter">

                <option value="">
                    All Customers
                </option>

            </select>



            <select id="managerFilter">

                <option value="">
                    Project Manager
                </option>

            </select>



            <select id="statusFilter">

                <option value="">
                    All Status
                </option>

                <option value="active">
                    Active
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="critical">
                    Critical
                </option>

                <option value="hold">
                    On Hold
                </option>

            </select>


        </section>



        <!-- =============================================
             PROJECT GRID
        ============================================== -->

        <section class="project-grid"
                 id="projectGrid">

            <!-- PROJECT CARDS WILL COME FROM JS -->

        </section>


    </main>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="../../assets/js/database.js"></script>

<script src="projectboard.js"></script>


</body>

</html>
